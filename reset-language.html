<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Language to English</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #0d0b09;
            color: #f0ebe0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #c8ad86;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        button {
            background: rgba(196,168,130,0.15);
            border: 1px solid rgba(196,168,130,0.35);
            color: #c8ad86;
            padding: 12px 32px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }
        button:hover {
            background: rgba(196,168,130,0.25);
            border-color: rgba(196,168,130,0.6);
        }
        .success {
            color: #50c878;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .success.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Reset Language</h1>
        <p>Click the button below to reset your website language preference to English and reload the page.</p>
        <button id="resetBtn">Reset to English</button>
        <p class="success" id="successMsg">✓ Language reset! Redirecting...</p>
    </div>

    <script>
        document.getElementById('resetBtn').addEventListener('click', function() {
            // Clear language from localStorage
            localStorage.removeItem('lang');
            
            // Set to English explicitly
            localStorage.setItem('lang', 'en');
            
            // Show success message
            const successMsg = document.getElementById('successMsg');
            successMsg.classList.add('show');
            
            // Redirect to home page after short delay
            setTimeout(function() {
                window.location.href = '/';
            }, 1500);
        });
    </script>
</body>
</html>
